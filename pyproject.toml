[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-local"
version = "0.1.0"
description = "Локальний реєстр колісної техніки AUTO"
requires-python = ">=3.12,<3.13"
dependencies = [
  "streamlit>=1.40,<2",
  "sqlmodel>=0.0.24,<0.1",
  "alembic>=1.14,<2",
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["auto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
